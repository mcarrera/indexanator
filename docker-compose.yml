services:
  backend:
    build: ./backend
    environment:
      SHEET_ID: ${SHEET_ID}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      SHEET_RANGE: ${SHEET_RANGE:-Sheet1!D2:H520}
      POLL_MINUTES: ${POLL_MINUTES:-60}
    expose:
      - "3000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped