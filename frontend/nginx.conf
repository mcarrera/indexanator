server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # Same-origin proxy: the browser never hits the backend directly,
    # so CORS never comes into play.
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
    }
}